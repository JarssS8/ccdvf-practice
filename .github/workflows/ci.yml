name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # API and account-linking tests against a local Worker with a throwaway D1 (no secrets, no network)
      - run: npm run test:e2e -- --no-build
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
